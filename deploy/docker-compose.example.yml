# Example deployment. Every path here is a placeholder — supply your own.
#
# The container paths (/backup, /archive) are fixed and generic; you map your
# own host directories onto them. Nothing about one user's layout is baked in.

services:
  protect-manager:
    image: protect-manager:local
    restart: unless-stopped

    volumes:
      # Read-only, and only this container touches it. The Docker API is
      # root-equivalent on the host, so it is never exposed on a network port.
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # The backup container's output root: camera directories plus the
      # directory holding events.sqlite.
      # Writable: archiving removes the originals once an archive has been
      # written and verified. Mount it `:ro` if you would rather it could not.
      - ${BACKUP_DIR:?path to your unifi-protect-backup output root}:/backup

      # Where .tar archives are written. This one the app writes to itself, so
      # it must be writable by the container's uid (10001) or by a group listed
      # in `group_add` below — otherwise every archive run fails with
      # "Permission denied". /api/health checks this by actually writing, and
      # says which ids it saw, so a mismatch shows up on the dashboard rather
      # than halfway through a run.
      - ${ARCHIVE_DIR:?path to your archive directory}:/archive

      - pm-state:/var/lib/protect-manager   # our database, sessions, caches

    environment:
      # Generate with: docker run --rm protect-manager:local hash-password 'your-password'
      - PM_PASSWORD_HASH=${PM_PASSWORD_HASH:?run hash-password to generate this}

      # Which container is the backup service is discovered by image, not by
      # name — compose deployments that don't set container_name get a
      # generated one, so any hardcoded name would be wrong elsewhere.
      # Override only if you run a fork or a retagged image:
      # - PM_UPB_IMAGE=ghcr.io/ep1cman/unifi-protect-backup

    # The gid that owns the clip files: `stat -c %g <a-clip-file>`. Without it
    # the app cannot read the clip directory, and /api/health will say so.
    # Depending on your host you may also need the docker socket's group, and
    # the group owning the archive directory if it differs from the clip files'
    # — the simpler alternative for that one is
    # `chown 10001 "$ARCHIVE_DIR"` on the host.
    group_add:
      - ${CLIP_GID:?gid owning the clip files}

    # Bound to the reverse proxy's reach only. TLS terminates at the proxy, and
    # the session cookie is Secure, so plain HTTP access will not stay logged in.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8642:8642"

volumes:
  pm-state:
