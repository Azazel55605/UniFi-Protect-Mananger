  <rect x="32" y="16" width="18" height="3" fill="#8b98a8"/>
  <rect x="32" y="22" width="12" height="3" fill="#4a5462"/>
  <rect x="14" y="36" width="36" height="3" fill="#2a323c"/>
  <rect x="14" y="44" width="24" height="3" fill="#2a323c"/>
</svg>
