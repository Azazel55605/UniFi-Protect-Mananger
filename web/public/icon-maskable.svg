<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Protect Manager">
  <!-- Maskable: everything that matters stays inside the safe circle, since
       the platform is free to crop this to whatever shape it likes. -->
  <rect width="64" height="64" fill="#0b0f14"/>
  <rect x="20" y="20" width="10" height="10" fill="#ffb020"/>
  <rect x="34" y="21" width="12" height="3" fill="#8b98a8"/>
  <rect x="34" y="27" width="8" height="3" fill="#4a5462"/>
  <rect x="20" y="38" width="26" height="3" fill="#2a323c"/>
</svg>
