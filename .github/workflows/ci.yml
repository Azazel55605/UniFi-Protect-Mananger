name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        # Warnings are errors here, and only here: a warning that is allowed to
        # accumulate stops being read.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      # `cargo test -p protect-api-types` regenerates web/src/lib/types.gen.ts,
      # which is committed. If the step above changed it, the API contract moved
      # without the frontend's copy being updated — which typechecks fine today
      # and breaks at runtime as `undefined`. Catching it here is the whole
      # reason the file is generated rather than hand-written.
      - name: Generated types are up to date
        run: |
          if ! git diff --exit-code web/src/lib/types.gen.ts; then
            echo "::error::types.gen.ts is stale. Run 'cargo test -p protect-api-types' and commit the result."
            exit 1
          fi

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  image:
    name: Image
    runs-on: ubuntu-latest
    # Releases only. Every ordinary push still gets clippy, tests and a
    # typecheck; what it does not get is a ten-minute image build and a package
    # nobody asked for. Tagging is the moment you have decided a build is worth
    # keeping, so that is the moment it is built.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # The action lowercases the repository name, which ghcr requires and
          # this repository's name does not already satisfy.
          images: ghcr.io/${{ github.repository }}
          # v0.2.0 publishes 0.2.0, 0.2 and latest. The floating tags are what
          # a compose file can track without being edited for every release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # `latest=auto` moves `latest` only for a plain release, so tagging
          # v0.3.0-rc1 to try something does not hand it to everyone pulling
          # `latest` — it publishes 0.3.0-rc1 and nothing else.
          flavor: latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
