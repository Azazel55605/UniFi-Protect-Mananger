[package]
name = "protect-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Management layer for a unifi-protect-backup deployment"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
bollard = "0.21.0"
futures-util = "0.3.34"
password-hash = { version = "0.5", features = ["getrandom"] }
protect-api-types = { version = "0.2.0", path = "../protect-api-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tar = "0.4.46"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs", "process"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Driving the router directly in tests, without binding a port.
tower = { version = "0.5", features = ["util"] }
